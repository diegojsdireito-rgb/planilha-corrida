<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5f50"/>
      <stop offset=".5" stop-color="#2f6f5e"/>
      <stop offset="1" stop-color="#3d5a99"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".2" cy="1.05" r=".55">
      <stop offset="0" stop-color="#f2b100" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f2b100" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <rect width="512" height="512" fill="url(#brilho)"/>
  <g transform="translate(256 262) scale(.8) translate(-256 -256)">
  <!-- tabuleiro ao fundo -->
  <g transform="translate(256 256) rotate(-8) translate(-150 -150)" opacity=".22" fill="#fff">
    <rect x="0" y="0" width="75" height="75"/><rect x="150" y="0" width="75" height="75"/>
    <rect x="75" y="75" width="75" height="75"/><rect x="225" y="75" width="75" height="75"/>
    <rect x="0" y="150" width="75" height="75"/><rect x="150" y="150" width="75" height="75"/>
    <rect x="75" y="225" width="75" height="75"/><rect x="225" y="225" width="75" height="75"/>
  </g>
  <!-- dado -->
  <g filter="url(#sombra)" transform="translate(150 290) rotate(-14)">
    <rect x="-95" y="-95" width="190" height="190" rx="38" fill="#fffdf8"/>
    <g fill="#1d1b18">
      <circle cx="-46" cy="-46" r="19"/><circle cx="46" cy="-46" r="19"/>
      <circle cx="0" cy="0" r="19"/>
      <circle cx="-46" cy="46" r="19"/><circle cx="46" cy="46" r="19"/>
    </g>
  </g>
  <!-- peão do ludo -->
  <g filter="url(#sombra)" transform="translate(358 330)">
    <circle cx="0" cy="-70" r="42" fill="#e5484d"/>
    <path d="M-34 -36 h68 l26 96 h-120 z" fill="#e5484d"/>
    <rect x="-70" y="56" width="140" height="34" rx="17" fill="#c7353a"/>
    <circle cx="-14" cy="-84" r="13" fill="#fff" opacity=".45"/>
  </g>
  <!-- cartas -->
  <g filter="url(#sombra)" transform="translate(330 130) rotate(12)">
    <rect x="-62" y="-84" width="124" height="168" rx="16" fill="#fffdf8"/>
    <text x="0" y="34" font-family="Georgia, serif" font-size="110" font-weight="700" text-anchor="middle" fill="#d03b3b">♥</text>
  </g>
  </g>
</svg>
